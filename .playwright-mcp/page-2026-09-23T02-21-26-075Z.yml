          - heading "无供应商锁定" [level=3] [ref=f2e657]
          - paragraph [ref=f2e658]: 自带 LLM 提供商、更换 智能体 后端、扩展 API。你拥有整个技术栈的控制权。
        - generic [ref=f2e659]:
          - heading "默认透明" [level=3] [ref=f2e660]
          - paragraph [ref=f2e661]: 每一行代码都可审计。确切了解你的 智能体 如何做决策、任务如何路由、数据流向何方。
        - generic [ref=f2e662]:
          - heading "社区驱动" [level=3] [ref=f2e663]
          - paragraph [ref=f2e664]: 与社区一起建设，而不仅仅是为社区建设。贡献技能、集成和 智能体 后端，让每个人受益。
    - generic [ref=f2e666]:
      - generic [ref=f2e667]:
        - paragraph [ref=f2e668]: 常见问题
        - heading "问与答。" [level=2] [ref=f2e669]
      - generic [ref=f2e670]:
        - generic [ref=f2e671]:
          - button "Lumen 支持哪些编码 智能体？" [ref=f2e672]
          - paragraph [ref=f2e677]: Lumen 开箱即用支持 26 款 AI 编程工具：Antigravity、Claude Code、CodeBuddy、CodeArts、Codex、Copilot、Cursor、DeepSeek Harness、DevEco Code、Dim、Grok、Hermes、Kimi、Kiro CLI、MiniMax Code、Oh-My-Pi、OpenClaw、OpenCode、Pi、Qoder、Qoder CN、Qwen Code、QwenPaw、Reasonix、Trae CLI、ZeroClaw。守护进程会自动检测本机已安装的 CLI 并为每款注册一个运行时。因为开源，你也可以自己添加后端。
        - generic [ref=f2e678]:
          - button "需要自托管吗，还是有云版本？" [ref=f2e679]
          - paragraph [ref=f2e684]: 两者都有。你可以用 Docker Compose 或 Kubernetes 在自己的基础设施上自托管 Lumen，也可以使用我们的托管云版本。你的数据，你选择。
        - generic [ref=f2e685]:
          - button "这和直接用编码 智能体 有什么区别？" [ref=f2e686]
          - paragraph [ref=f2e691]: 编码 智能体 擅长执行。Lumen 添加的是管理层：任务队列、团队协作、技能复用、运行时监控，以及每个 智能体 在做什么的统一视图。把它想象成你的 智能体 的项目经理。
        - generic [ref=f2e692]:
          - button "智能体 能自主处理长时间任务吗？" [ref=f2e693]
          - paragraph [ref=f2e698]: 可以。Lumen 管理完整的任务生命周期——入队、领取、执行、完成或失败。智能体 主动报告阻塞并实时推送进度。你可以随时查看，也可以让它们运行整晚。
        - generic [ref=f2e699]:
          - button "我的代码安全吗？智能体 在哪里执行？" [ref=f2e700]
          - paragraph [ref=f2e705]: 智能体 在你的机器（本地守护进程）或你自己的云基础设施上执行。代码永远不会经过 Lumen 服务器。平台只协调任务状态和广播事件。
        - generic [ref=f2e706]:
          - button "我可以运行多少个 智能体？" [ref=f2e707]
          - paragraph [ref=f2e712]: 取决于你的硬件。每个 智能体 有可配置的并发限制，你可以连接多台机器作为运行时。开源版本没有任何人为限制。
